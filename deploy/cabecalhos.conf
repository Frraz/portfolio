# Incluído em todo location: add_header não herda entre níveis do nginx.
add_header Content-Security-Policy $csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Selo 3 do CTF, de propósito à vista: quem lê cabeçalhos encontra. Mesmo valor de src/ctf/selos.ts.
add_header X-Selo "CABECALHO-HTTP" always;
